<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap"
  rel="stylesheet"
/>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "JetBrains Mono", monospace;
    line-height: 1.6;
    color: #ccc;
    background: #000;
    padding: 2rem;
  }

  .terminal-wrapper {
    max-width: 900px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 2rem;
  }

  .header-content {
    padding: 1rem 0;
  }

  .header-content h1 {
    font-size: 1.25rem;
    color: #fff;
    margin-bottom: 0.5rem;
  }

  .page-command {
    color: #888;
    font-size: 0.85rem;
    margin-bottom: 1rem;
  }

  nav {
    display: flex;
    gap: 1rem;
  }

  nav a {
    color: #888;
    text-decoration: none;
    transition: color 0.2s;
  }

  nav a:hover,
  nav a.active {
    color: #fff;
  }

  footer {
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 1px solid #333;
    color: #444;
    font-size: 0.85rem;
  }

  @media (max-width: 768px) {
    body {
      padding: 1rem;
    }
  }

  ::selection {
    background: #333;
    color: #fff;
  }
</style>
