<!doctype html>
<html lang="{{ .Site.LanguageCode }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neighbourhood - {{ .Site.Title }}</title>
    <meta name="description" content="A list over all my internet neighbours" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "JetBrains Mono", monospace;
        line-height: 1.6;
        color: #ccc;
        background: #000;
        padding: 2rem;
      }

      .terminal-wrapper {
        max-width: 900px;
        margin: 0 auto;
      }

      header {
        margin-bottom: 2rem;
      }

      .header-content {
        padding: 1rem 0;
      }

      .header-content h1 {
        font-size: 1.25rem;
        color: #fff;
        margin-bottom: 1rem;
      }

      nav {
        display: flex;
        gap: 1rem;
      }

      nav a {
        color: #888;
        text-decoration: none;
        transition: color 0.2s;
      }

      nav a:hover,
      nav a.active {
        color: #fff;
      }

      .intro {
        color: #888;
        margin-bottom: 2rem;
      }

      .neighbours-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.5rem;
      }

      .neighbour-card {
        border: 1px solid #333;
        transition: border-color 0.2s;
      }

      .neighbour-card:hover {
        border-color: #666;
      }

      .neighbour-card a {
        text-decoration: none;
        color: inherit;
        display: block;
      }

      .neighbour-screenshot {
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: cover;
        display: block;
        background: #111;
      }

      .neighbour-info {
        padding: 0.75rem;
        border-top: 1px solid #333;
      }

      .neighbour-name {
        color: #fff;
        font-size: 0.95rem;
        font-weight: 700;
      }

      .neighbour-url {
        color: #666;
        font-size: 0.75rem;
        margin-top: 0.25rem;
      }

      .no-neighbours {
        color: #444;
      }

      footer {
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid #333;
        color: #444;
        font-size: 0.85rem;
      }

      @media (max-width: 768px) {
        body {
          padding: 1rem;
        }
      }

      ::selection {
        background: #333;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="terminal-wrapper">
      <header>
        <div class="header-content">
          <h1>$ ls neighbourhood/</h1>
          <nav>
            <a href="{{ .Site.BaseURL }}">Home</a>
            <a href="{{ .Site.BaseURL }}blog/">Blog</a>
            <a href="{{ .Site.BaseURL }}neighbourhood/" class="active"
              >Neighbourhood</a
            >
          </nav>
        </div>
      </header>

      <div class="panel">
        <div class="intro">{{ .Content }}</div>
        <div class="neighbours-grid">
          {{ range .Params.neighbours }}
          <div class="neighbour-card">
            <a href="{{ .url }}" target="_blank" rel="noopener noreferrer">
              <img
                class="neighbour-screenshot"
                src="https://image.thum.io/get/{{ .url }}"
                alt="Screenshot of {{ .name }}"
                loading="lazy"
              />
              <div class="neighbour-info">
                <div class="neighbour-name">{{ .name }}</div>
                <div class="neighbour-url">{{ .url }}</div>
              </div>
            </a>
          </div>
          {{ else }}
          <div class="no-neighbours">No neighbours yet.</div>
          {{ end }}
        </div>
      </div>

      <footer>&copy; {{ now.Year }} Jobjorn Rokenes Myren</footer>
    </div>
  </body>
</html>
