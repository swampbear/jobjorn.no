<!doctype html>
<html lang="{{ .Site.LanguageCode }}">
  <head>
    <title>Neighbourhood - {{ .Site.Title }}</title>
    <meta name="description" content="A list over all my internet neighbours" />
    {{ partial "head.html" . }}
    <style>
      .intro {
        color: #888;
        margin-bottom: 2rem;
      }

      .neighbours-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.5rem;
      }

      .neighbour-card {
        border: 1px solid #333;
        transition: border-color 0.2s;
      }

      .neighbour-card:hover {
        border-color: #666;
      }

      .neighbour-card a {
        text-decoration: none;
        color: inherit;
        display: block;
      }

      .neighbour-screenshot {
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: cover;
        display: block;
        background: #111;
      }

      .neighbour-info {
        padding: 0.75rem;
        border-top: 1px solid #333;
      }

      .neighbour-name {
        color: #fff;
        font-size: 0.95rem;
        font-weight: 700;
      }

      .neighbour-url {
        color: #666;
        font-size: 0.75rem;
        margin-top: 0.25rem;
      }

      .no-neighbours {
        color: #444;
      }
    </style>
  </head>
  <body>
    <div class="terminal-wrapper">
      {{ partial "header.html" (dict "Site" .Site "command" "~ ls neighbourhood/" "active" "neighbourhood") }}

      <div class="panel">
        <div class="intro">{{ .Content }}</div>
        <div class="neighbours-grid">
          {{ range .Params.neighbours }}
          <div class="neighbour-card">
            <a href="{{ .url }}" target="_blank" rel="noopener noreferrer">
              <img
                class="neighbour-screenshot"
                src="https://image.thum.io/get/{{ .url }}"
                alt="Screenshot of {{ .name }}"
                loading="lazy"
              />
              <div class="neighbour-info">
                <div class="neighbour-name">{{ .name }}</div>
                <div class="neighbour-url">{{ .url }}</div>
              </div>
            </a>
          </div>
          {{ else }}
          <div class="no-neighbours">No neighbours yet.</div>
          {{ end }}
        </div>
      </div>

      {{ partial "footer.html" . }}
    </div>
  </body>
</html>
